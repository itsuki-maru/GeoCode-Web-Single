name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_IP_ADDRESS: ""
  VITE_ASSET_PATH: "/assets/"

jobs:
  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - src_frontend/frontend
          - src_frontend/frontend-mobile
          - src_frontend/frontend-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ${{ matrix.app }}/package-lock.json
            src_frontend/template-scripts/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix ${{ matrix.app }}

      # フロントエンドのテストは隣接するテンプレートのソースを読み込む。ジョブ間では node_modules を共有しない。
      - name: Install template test dependencies
        if: matrix.app == 'src_frontend/frontend'
        run: npm ci --prefix src_frontend/template-scripts

      - name: Type-check
        run: npm run type-check --prefix ${{ matrix.app }}

      - name: Build
        run: npm run build-only --prefix ${{ matrix.app }}

      - name: Test
        if: matrix.app == 'src_frontend/frontend'
        run: npm run test:run --prefix ${{ matrix.app }}

  template-scripts:
    name: Template scripts test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src_frontend/template-scripts/package-lock.json
            src_frontend/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix src_frontend/template-scripts

      # 共通の統合テスト群は、フロントエンドのテスト、tsconfig、外部ライブラリのアセットを読み込む。
      - name: Install frontend test dependencies
        run: npm ci --prefix src_frontend/frontend

      - name: Test
        run: npm test --prefix src_frontend/template-scripts

      - name: Type-check and build
        run: npm run build --prefix src_frontend/template-scripts

  rust:
    name: Rust format, test, and integration build
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src_frontend/frontend/package-lock.json
            src_frontend/frontend-admin/package-lock.json
            src_frontend/frontend-mobile/package-lock.json
            src_frontend/template-scripts/package-lock.json

      - name: Read pinned frontend source
        id: frontend-source
        shell: pwsh
        run: |
          $baseline = Get-Content tests/fixtures/frontend-compat-baseline.json -Raw | ConvertFrom-Json
          if ($baseline.repository -notmatch '^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$' -or $baseline.source_ref -notmatch '^[a-f0-9]{40}$') {
            throw 'Invalid pinned frontend source'
          }
          "repository=$($baseline.repository)" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          "ref=$($baseline.source_ref)" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

      - name: Checkout pinned PostgreSQL frontend source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.frontend-source.outputs.repository }}
          ref: ${{ steps.frontend-source.outputs.ref }}
          path: .frontend-source
          token: ${{ secrets.FRONTEND_SOURCE_TOKEN || github.token }}
          persist-credentials: false

      - name: Check shared frontend compatibility
        run: node scripts/check-frontend-compat.mjs --source-root .frontend-source

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check rendering compatibility review
        shell: pwsh
        run: |
          cargo test --locked --manifest-path scripts/render-compatibility/Cargo.toml --target-dir target/render-identity-verification/tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-render-compatibility.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate CI .env
        shell: pwsh
        run: |
          @"
          DATABASE_URL=sqlite:./ci.sqlite
          CREATEDATABASE_PATH=./ci.sqlite
          VITE_IP_ADDRESS=
          VITE_ASSET_PATH=/assets/
          "@ | Set-Content -Path .env -Encoding UTF8

      - name: Install SQLx CLI
        shell: pwsh
        run: cargo install sqlx-cli --no-default-features --features sqlite

      - name: Create SQLite database and run migrations
        shell: pwsh
        run: |
          sqlx database create
          sqlx migrate run

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          npm ci --prefix src_frontend/frontend
          npm ci --prefix src_frontend/frontend-mobile
          npm ci --prefix src_frontend/frontend-admin
          npm ci --prefix src_frontend/template-scripts

      - name: Build embedded frontend assets
        shell: pwsh
        run: |
          node --test tests/frontend-compat.test.mjs tests/build-frontend-assets.test.mjs
          node scripts/check-frontend-compat.mjs
          ./scripts/build-frontend-assets.ps1 -SkipCargoBuild -OutputRoot target/frontend-dist
          $assets = (Resolve-Path target/frontend-dist).Path
          "GEOCODE_FRONTEND_DIST=$assets" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          $tauri = @{ build = @{ frontendDist = $assets } } | ConvertTo-Json -Compress
          "TAURI_CONFIG=$tauri" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8

      - name: Validate embedded template assets
        shell: pwsh
        run: |
          $requiredAssets = @(
            "template-map.js",
            "template-map-mobile.js",
            "template-map-anather.js",
            "template-temporary-map.js",
            "template-temporary-map-mobile.js",
            "template-image-preview.js",
            "template-marker-form.js",
            "template-manifest.json"
          )
          foreach ($asset in $requiredAssets) {
            if (-Not (Test-Path "target/frontend-dist/assets/$asset")) {
              throw "Required template asset was not generated: $asset"
            }
          }
          if (Get-ChildItem "target/frontend-dist/assets" -File -Filter "map-common-*.js") {
            throw "Removed compatibility scripts were included in dist/assets"
          }
          if (Get-ChildItem "target/frontend-dist/templates" -File | Where-Object Extension -ne ".html") {
            throw "target/frontend-dist/templates contains a non-HTML file"
          }

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Test Rust
        run: cargo test --locked
