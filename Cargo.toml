[package]
name = "geocode_web_single"
version = "1.14.0"
edition = "2024"
license = "MIT"
description = "Windows-first offline/local mapping wiki app built with Rust, Axum, Vue 3, SQLite, and Tauri."
readme = "README.md"

# その他のキーと定義は https://doc.rust-lang.org/cargo/reference/manifest.html を参照。

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "float_roundtrip"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-native-tls", "chrono", "uuid", "json", "macros", "migrate"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "9.3.1", default-features = false }
bcrypt = "0.19.2"
chrono = { version = "0.4", features = ["serde"] }
headers = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features= ["full"] }
futures-util = "0.3.30"
tokio-util = { version = "0.7.10", features= ["full"] }
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }
http-body-util = "0.1.0"
tauri = { version = "2", features = [] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = "0.25"
thiserror = "1.0"
tera = "1.20"
once_cell = "1.20.3"
totp-rs = { version = "5", features = ["qr"] }
base32 = "0.4"
rand = "0.8"
rust-embed = "8.5.0"
anyhow = "1.0"
rexif = "0.7.5"
dirs = "5.0"
open = "5"
windows = { version = "0.60", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Storage_FileSystem"] }
reqwest = "0.12"
roxmltree = "0.20"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
ring = "0.17"
pulldown-cmark = "0.13"
ammonia = "4"
flate2 = "1"
quick-xml = "=0.41.0"
crc32fast = "=1.5.0"
fs2 = "0.4"
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
osmpbfreader = "0.19.1"
protobuf = "3"
rusqlite = { version = "0.32.1", features = ["bundled", "hooks"] }
tempfile = "3"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
harfrust = { version = "=0.16.0", default-features = false, features = ["libm"] }
skrifa = { version = "=0.50.0", default-features = false, features = ["libm"] }
unicode-segmentation = "=1.13.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
