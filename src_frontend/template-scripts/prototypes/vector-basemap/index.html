<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ベクタ背景・印刷の試作</title>
    <link rel="stylesheet" href="/vendor/leaflet.css" />
    <link rel="stylesheet" href="/vendor/MarkerCluster.css" />
    <link rel="stylesheet" href="/vendor/MarkerCluster.Default.css" />
    <script src="/vendor/leaflet.js"></script>
    <script src="/vendor/leaflet.markercluster.js"></script>
    <script src="/vendor/marked.js"></script>
    <script src="/vendor/xss.js"></script>
    <style>
      #map { width: 100%; height: 100%; }
      #prototype-controls { margin: 0 0 18px; padding: 12px; border: 1px solid #bbcbd9; border-radius: 8px; background: #f5f9ff; font-size: 13px; }
      #prototype-controls button { padding: 7px 10px; margin: 3px; cursor: pointer; }
      #prototype-status { line-height: 1.6; }
      .prototype-marker { background: #c23a43; width: 16px !important; height: 16px !important; border: 3px solid white; border-radius: 50%; box-shadow: 0 1px 4px #3338; }
      @media (max-width: 600px) { #print-layout { grid-template-columns: 170px minmax(0, 1fr); } #print-settings { padding: 10px; } }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
