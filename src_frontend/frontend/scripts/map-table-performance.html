<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        margin: 0;
        font: 14px sans-serif;
      }
      #host {
        width: 42vw;
      }
      #map {
        position: fixed;
        left: 42vw;
        top: 0;
        width: 58vw;
        height: 100vh;
      }
      table {
        padding: 0;
      }
      table tr {
        border-top: 1px solid #ccc;
        background: white;
        margin: 0;
        padding: 0;
      }
      table tr:nth-child(2n) {
        background: #eee;
      }
      table tr th {
        border: 1px solid #ccc;
        text-align: left;
        margin: 0;
        padding: 6px 13px;
      }
      table tr td {
        border: 1px solid #ccc;
        text-align: left;
        margin: 0;
        padding: 6px 13px;
        font-size: 12px;
      }
      @media (max-width: 600px) {
        #host {
          width: 100vw;
        }
        #map {
          left: 0;
          width: 100vw;
          z-index: -1;
        }
      }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <div id="map"></div>
    <script type="module" src="/table-benchmark-entry.ts"></script>
  </body>
</html>
