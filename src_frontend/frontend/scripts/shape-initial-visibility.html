<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/vendor/leaflet.css" />
    <style>
      html,
      body {
        margin: 0;
      }
      #map {
        width: 100vw;
        height: 100vh;
      }
      .leaflet-control {
        font: 12px sans-serif;
      }
    </style>
    <script src="/vendor/leaflet.js"></script>
    <script src="/vendor/cluster.js"></script>
    <script src="/vendor/marked.js"></script>
    <script src="/vendor/xss.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <div id="draw-status" class="is-hidden"></div>
    <script type="module">
      const entry = new URLSearchParams(location.search).get("entry");
      const initialize =
        entry === "map-anather"
          ? (await import("/src/map/read-only-page.ts")).initializeReadOnlyMapPage
          : (await import("/benchmark-" + entry + ".ts")).initializeBenchmarkEditor;
      Object.defineProperty(navigator, "geolocation", {
        configurable: true,
        value: { watchPosition: () => 1, clearWatch() {} },
      });
      const originalFetch = window.fetch;
      window.fetch = (input, options) => {
        const url = new URL(String(input), location.href);
        if (url.pathname === "/marker/read/all" || url.pathname === "/shapes") {
          return Promise.resolve(
            new Response(JSON.stringify(url.pathname === "/shapes" ? [] : {}), {
              status: 200,
              headers: { "Content-Type": "application/json" },
            }),
          );
        }
        return originalFetch(input, options);
      };
      const frame = () => new Promise((resolve) => requestAnimationFrame(resolve));
      const frames = async () => {
        await frame();
        await frame();
      };
      const longTasks = [];
      try {
        new PerformanceObserver((list) =>
          longTasks.push(
            ...list.getEntries().map((t) => ({ start: t.startTime, duration: t.duration })),
          ),
        ).observe({ type: "longtask", buffered: false });
      } catch {}
      const round = (n) => Math.round(n * 100) / 100;
      let creations = 0;
      const original = L.geoJSON;
      L.geoJSON = function (...args) {
        creations++;
        return original.apply(this, args);
      };
      const toggle = (name) => {
        const label = [...document.querySelectorAll(".leaflet-control-layers label")].find(
          (label) => label.textContent.trim() === name,
        );
        if (!label) throw Error("Missing visibility control: " + name);
        const input = label.querySelector("input");
        if (!input.checked) input.click();
      };
      window.measure = async (test, mode) => {
        localStorage.clear();
        if (mode === "manual") {
          localStorage.setItem("geocode-web:shape-layer-visible", "false");
          localStorage.setItem("geocode-web:shape-name-visible", "false");
        }
        const shapes = Array.from({ length: test.count }, (_, i) => {
          const near = test.dense || i < 80,
            lat = (near ? 35.68 : 34.69) + (i % 20) * (test.dense ? 0.00004 : 0.0002),
            lng =
              (near ? 139.76 : 135.5) +
              (Math.floor(i / 20) % 100) * (test.dense ? 0.00004 : 0.0002);
          return {
            id: "s-" + i,
            layer_id: "a",
            name: "",
            shape_type: "polyline",
            user_id: "benchmark",
            geojson: {
              type: "Feature",
              properties: {
                style: { color: "#2468ac", weight: 3, arrowType: i % 5 === 0 ? "end" : "none" },
              },
              geometry: {
                type: "LineString",
                coordinates: Array.from({ length: test.vertices }, (_, j) => [
                  lng + (0.001 * j) / (test.vertices - 1),
                  lat + 0.0001 * Math.sin(j),
                ]),
              },
            },
          };
        });
        const tileServers = {
          1: {
            id: 1,
            label: "blank",
            layer_name: "blank",
            url: "/blank/{z}/{x}/{y}.png",
            attribution: "benchmark",
            include_foreign_tiles: true,
            min_zoom: 0,
            max_zoom: 20,
          },
        };
        const layers = {
          a: { id: "a", user_id: "benchmark", layer_name: "pipes", is_master: false },
        };
        Object.assign(window, {
          tileServers,
          latitude: 35.681,
          longitude: 139.7615,
          zoom: test.zoom,
          is_master: true,
          layer: "a",
          markerId: "0",
          layersFromAxum: layers,
          markersFromAxum: {},
          shapesFromAxum: shapes,
        });
        window.__GEOCODE_MAP_BOOTSTRAP__ = {
          page: entry,
          initialView: { latitude, longitude, zoom },
          isMaster: true,
          selectedLayer: "a",
          markerId: "0",
          isCluster: false,
          tileServers,
          layers,
          markers: {},
          shapes,
          tileOverlays: [],
        };
        await frames();
        creations = 0;
        longTasks.length = 0;
        const start = performance.now();
        const runtime = initialize(entry);
        const manager = runtime.shapeRenderer;
        const initSyncMs = performance.now() - start;
        const initiallyCreated = creations;
        const initialStats = manager.getStats();
        let manualEnableMs = null;
        const enabled = performance.now();
        if (mode === "manual") {
          toggle("図形");
          toggle("図形名");
        }
        // This existing layer mask is independent of shape visibility and stays OFF
        // initially in the normal another-map page. Select it explicitly in both modes.
        if (entry === "map-anather") toggle("pipes");
        if (mode === "manual" || entry === "map-anather") {
          await new Promise((resolve) => setTimeout(resolve, 0));
          while (runtime.getObjectLoadStatus?.().loading) await frames();
          if (runtime.getObjectLoadStatus?.().failed) throw Error("Fixture object load failed");
        }
        await manager.whenIdle();
        if (mode === "manual") manualEnableMs = performance.now() - enabled;
        const readyMs = performance.now() - start;
        await frames();
        const initial = {
          initSyncMs: round(initSyncMs),
          initiallyCreated,
          initialPending: initialStats.pendingCount,
          readyMs: round(readyMs),
          manualEnableMs: manualEnableMs === null ? null : round(manualEnableMs),
          creations,
          paths: document.querySelectorAll("#map svg path").length,
          ...manager.getStats(),
        };
        const moved = performance.now();
        runtime.map.setView([20, 125], 14, { animate: false });
        const moveSyncMs = performance.now() - moved;
        await manager.whenIdle();
        const moveReadyMs = performance.now() - moved;
        await frames();
        const afterMove = {
          syncMs: round(moveSyncMs),
          readyMs: round(moveReadyMs),
          ...manager.getStats(),
        };
        const end = performance.now();
        await frames();
        const tasks = longTasks.filter((t) => t.start + t.duration > start && t.start <= end);
        const result = {
          initial,
          afterMove,
          longTaskCount: tasks.length,
          maxLongTaskMs: round(Math.max(0, ...tasks.map((t) => t.duration))),
          heapBytes: performance.memory?.usedJSHeapSize ?? null,
        };
        runtime.map.remove();
        return result;
      };
      window.ready = true;
    </script>
  </body>
</html>
