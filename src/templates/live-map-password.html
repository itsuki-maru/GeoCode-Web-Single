<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>現在位置共有マップ</title>
        <style>
            html,
            body {
                margin: 0;
                min-height: 100%;
            }
            body {
                align-items: center;
                background: #f6f8fa;
                color: #1f2328;
                display: flex;
                font-family:
                    "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
                justify-content: center;
                padding: 24px;
            }
            .card {
                background: #fff;
                border: 1px solid #d0d7de;
                border-radius: 12px;
                box-shadow: 0 8px 24px #8c959f33;
                box-sizing: border-box;
                max-width: 440px;
                padding: 28px;
                width: 100%;
            }
            h1 {
                font-size: 22px;
                margin: 0 0 12px;
            }
            p {
                color: #57606a;
                line-height: 1.6;
            }
            .error {
                background: #ffebe9;
                border-radius: 6px;
                color: #cf222e;
                padding: 10px;
            }
            form {
                display: grid;
                gap: 12px;
                margin-top: 20px;
            }
            label {
                display: grid;
                font-weight: 600;
                gap: 6px;
            }
            input {
                border: 1px solid #8c959f;
                border-radius: 6px;
                font-size: 16px;
                padding: 10px;
            }
            button {
                background: #0969da;
                border: 0;
                border-radius: 6px;
                color: #fff;
                cursor: pointer;
                font-size: 16px;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <h1>現在位置共有マップ</h1>
            <p>この共有マップを表示するにはパスワードが必要です。</p>
            {% if errorMessage != "" %}
            <p class="error">{{ errorMessage }}</p>
            {% endif %}
            <form method="post" action="/live/{{ publicId }}/authenticate">
                <label>
                    共有パスワード
                    <input
                        type="password"
                        name="password"
                        minlength="4"
                        maxlength="64"
                        autocomplete="current-password"
                        required
                        autofocus
                    />
                </label>
                <button type="submit">地図を表示</button>
            </form>
        </main>
    </body>
</html>
