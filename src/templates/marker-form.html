<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ form_title }}</title>
        <style>
            :root {
                color-scheme: light;
                font-family:
                    "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
                color: #172033;
                background: #f1f5f9;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                padding: 32px 16px;
                background:
                    radial-gradient(
                        circle at top left,
                        #dbeafe 0,
                        transparent 38%
                    ),
                    #f1f5f9;
            }
            main {
                width: min(680px, 100%);
                margin: 0 auto;
                padding: 30px;
                border: 1px solid #dbe3ee;
                border-radius: 20px;
                background: rgba(255, 255, 255, 0.97);
                box-shadow: 0 18px 50px rgba(30, 64, 175, 0.1);
            }
            h1 {
                margin: 0;
                font-size: clamp(24px, 5vw, 34px);
            }
            h1 + form { margin-top: 28px; }
            .description {
                margin: 12px 0 26px;
                color: #536176;
                line-height: 1.7;
                white-space: pre-wrap;
            }
            form {
                display: grid;
                gap: 28px;
            }
            #fields {
                display: grid;
                gap: 28px;
            }
            .field {
                display: grid;
                gap: 8px;
            }
            .field-label {
                font-weight: 700;
                line-height: 1.5;
            }
            .required {
                margin-left: 6px;
                color: #b42318;
                font-size: 12px;
            }
            input,
            textarea,
            select {
                width: 100%;
                min-height: 46px;
                padding: 11px 13px;
                border: 1px solid #b8c5d6;
                border-radius: 10px;
                background: #fff;
                color: inherit;
                font: inherit;
            }
            textarea {
                min-height: 130px;
                resize: vertical;
            }
            input:focus,
            textarea:focus,
            select:focus {
                outline: 3px solid rgba(37, 99, 235, 0.18);
                border-color: #2563eb;
            }
            .choice-list {
                display: grid;
                gap: 9px;
            }
            .choice {
                display: flex;
                align-items: center;
                gap: 9px;
                min-height: 38px;
            }
            .choice input {
                width: 20px;
                min-height: 20px;
                margin: 0;
            }
            .image-status {
                color: #536176;
                font-size: 13px;
            }
            .hint {
                color: #64748b;
                font-size: 12px;
            }
            button {
                min-height: 50px;
                border: 0;
                border-radius: 12px;
                background: #1d4ed8;
                color: #fff;
                font: inherit;
                font-weight: 700;
                cursor: pointer;
            }
            button:hover {
                background: #1e40af;
            }
            button:disabled {
                cursor: wait;
                opacity: 0.65;
            }
            .message {
                display: none;
                padding: 13px 15px;
                border-radius: 10px;
                line-height: 1.55;
            }
            .message.error {
                display: block;
                color: #8a1c13;
                background: #fee4e2;
            }
            .message.success {
                display: block;
                color: #075e45;
                background: #d1fadf;
            }
            main.completion-view {
                display: grid;
                min-height: calc(100vh - 64px);
                place-items: center;
            }
            .completion-view .message.success {
                width: min(420px, 100%);
                margin: 0;
                text-align: center;
                font-weight: 700;
            }
            @media (max-width: 560px) {
                body {
                    padding: 0;
                    background: #fff;
                }
                main {
                    min-height: 100vh;
                    padding: 24px 18px;
                    border: 0;
                    border-radius: 0;
                    box-shadow: none;
                }
            }
            #marker-form {
                margin-top: 2%;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>{{ form_title }}</h1>
            {% if form_description != "" %}
            <p class="description">{{ form_description }}</p>
            {% endif %}
            <form id="marker-form" autocomplete="off">
                <div id="fields"></div>
                {% if is_password_protected %}
                <div class="field">
                    <label class="field-label" for="form-password"
                        >フォームパスワード<span class="required"
                            >必須</span
                        ></label
                    >
                    <input
                        id="form-password"
                        type="password"
                        maxlength="64"
                        required
                        autocomplete="current-password"
                    />
                </div>
                {% endif %}
                <div
                    id="message"
                    class="message"
                    role="status"
                    aria-live="polite"
                ></div>
                <button id="submit-button" type="submit">入力内容を送信</button>
            </form>
        </main>
        <script>
            window.__GEOCODE_MARKER_FORM__ = {
                schema: {{ form_schema | json_encode_for_html | safe }},
                submissionPath: {{ submission_path | json_encode_for_html | safe }},
                isPasswordProtected: {{ is_password_protected | json_encode_for_html | safe }},
            };
        </script>
        <script type="module" src="/assets/template-marker-form.js"></script>
    </body>
</html>
